<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>S2C Web Play — Go2 touchdown in the browser</title>
    <meta
      name="description"
      content="Drive a Unitree Go2 against a trained policy in a browser MuJoCo simulation: real physics, real checkpoint weights, the same referee as the simulator."
    />
    <meta name="theme-color" content="#0A0F16" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23002D72'/%3E%3Crect x='7' y='12' width='18' height='9' rx='1.5' fill='none' stroke='%234FC3E8' stroke-width='1.6'/%3E%3Cline x1='20.5' y1='12' x2='20.5' y2='21' stroke='%23FF4724' stroke-width='1.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app" class="app"></div>

    <!-- Error mirror. Stays empty (and invisible) unless something throws; the
         headless screenshot harness reads it, and so can a player reporting a bug. -->
    <pre id="log" class="boot-log" aria-live="polite"></pre>
    <script>
      (function () {
        const pre = document.getElementById('log');
        const write = (msg) => {
          pre.textContent += msg + '\n';
          pre.classList.add('is-visible');
        };
        addEventListener('error', (e) =>
          write('error: ' + (e.error ? (e.error.stack || e.error.message) : e.message)));
        addEventListener('unhandledrejection', (e) =>
          write('unhandled rejection: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)));
        const err = console.error.bind(console);
        console.error = (...a) => { write(a.map(String).join(' ')); err(...a); };
      })();
    </script>

    <noscript>
      <div class="boot-error">
        <h1>JavaScript is required</h1>
        <p>This page runs a MuJoCo physics simulation and a neural network in your browser.</p>
      </div>
    </noscript>

    <script type="module">
      /*
       * The only thing index.html knows about is the entry point.
       *   app/main.js  — the integrator's boot (physics + policies + renderer + UI)
       *   ?uipreview=1 — interface only, driven by tests/ui_preview.mjs with stub state.
       *                  Documented test hook: it loads no wasm and no weights.
       */
      const params = new URLSearchParams(location.search);
      const preview = params.get('uipreview') === '1' || params.get('uipreview') === 'true';

      // One request for all of the code. The lab's custom domain sits behind a
      // proxy that 502s under parallel load, and a failed ES-module import cannot
      // be retried by the browser — so the bundle is fetched as text, with
      // retries, and imported from a blob. dist/app.bundle.js is built by
      // `npx esbuild app/main.js --bundle --format=esm --minify`.
      async function fetchTextRetry(url, tries = 5) {
        let last;
        for (let i = 0; i < tries; i++) {
          if (i) await new Promise((r) => setTimeout(r, [200, 500, 1200, 2500][Math.min(i - 1, 3)]));
          try {
            const res = await fetch(url);
            if (res.ok) return await res.text();
            last = new Error(url + ' -> HTTP ' + res.status);
            if (res.status === 404) break;
          } catch (err) { last = err; }
        }
        throw last;
      }

      try {
        let mod;
        if (preview) {
          mod = await import('./tests/ui_preview.mjs');
        } else {
          const code = await fetchTextRetry('./dist/app.bundle.js');
          const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
          try { mod = await import(url); } finally { URL.revokeObjectURL(url); }
        }
        if (mod && typeof mod.boot === 'function') await mod.boot();
      } catch (err) {
        console.error('[s2c] boot failed', err);
        const app = document.getElementById('app');
        app.innerHTML = '';
        const box = document.createElement('div');
        box.className = 'boot-error';
        const h1 = document.createElement('h1');
        h1.textContent = 'Could not load';
        const p = document.createElement('p');
        p.textContent = 'Reload the page — the server dropped a file.';
        const pre = document.createElement('pre');
        pre.textContent = String((err && err.stack) || err);
        box.append(h1, p, pre);
        app.appendChild(box);
      }
    </script>
  </body>
</html>
